name: argus
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - pysam
  - tabix
  - pip:
    # LangGraph pipeline
    - langgraph>=0.2.0
    - langchain>=0.3.0
    - langchain-community>=0.3.0

    # Anthropic (LLM planner + reporter)
    - anthropic>=0.40.0
    - langchain-anthropic>=0.3.0

    # JASPAR motif analysis
    - pyjaspar>=3.0.0

    # AlphaGenome Atlas (optional)
    - alphagenome>=0.9.0

    # DVR inference
    - torch>=2.0.0
    - transformers>=4.40.0

    # Utilities
    - requests
    - python-dotenv
